services:
  postgres:
    image: postgres:17-alpine
    container_name: waitlistos-postgres-dev
    ports:
      - "${DATABASE_PORT:-5436}:5432"
    volumes:
      - waitlistos_postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-waitlistos_secure_password}
      POSTGRES_DB: ${DATABASE_NAME:-waitlistos}
    networks:
      - waitlistos-network

  redis:
    image: redis:7-alpine
    container_name: waitlistos-redis-dev
    ports:
      - "${REDIS_PORT:-6384}:6379"
    volumes:
      - waitlistos_redis_data_dev:/data
    networks:
      - waitlistos-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    image: waitlistos-api:dev
    container_name: waitlistos-api-dev
    ports:
      - "${BACKEND_PORT:-4060}:3000"
    volumes:
      - ./api:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
      - waitlistos_files_data_dev:/usr/src/app/files
      - waitlistos_uploads_data_dev:/usr/src/app/uploads
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-waitlistos_secure_password}@postgres:5432/${DATABASE_NAME:-waitlistos}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3060}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3060,http://localhost:3000,http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3060}
    depends_on:
      - postgres
      - redis
    networks:
      - waitlistos-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    image: waitlistos-web:dev
    container_name: waitlistos-web-dev
    ports:
      - "${FRONTEND_PORT:-3060}:3000"
    volumes:
      - ./web:/usr/src/app
      - web_node_modules:/usr/src/app/node_modules
      - web_next:/usr/src/app/.next
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4060}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3060}
    depends_on:
      - api
    networks:
      - waitlistos-network

volumes:
  waitlistos_postgres_data_dev:
  waitlistos_redis_data_dev:
  waitlistos_files_data_dev:
  waitlistos_uploads_data_dev:
  api_node_modules:
  web_node_modules:
  web_next:

networks:
  waitlistos-network:
    driver: bridge
