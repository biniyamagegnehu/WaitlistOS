services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4060
        NEXT_PUBLIC_APP_URL: http://localhost:3060
    container_name: waitlistos-web-standalone
    ports:
      - "3060:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4060
      NEXT_PUBLIC_APP_URL: http://localhost:3060
